<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form File</title>
</head>
<body>
    <h2>Registration Form</h2>
    <form action="/action.php">
        <input type="text" placeholder="Enter UserName">
        <br><br>
        <input type="password" placeholder="Password">
        <br>
        <label for="101"> 
        <input type="radio" value="class XI" name="class" id="101">Class XI

        <br>
        <label for="102">
        <input type="radio" value="class XII" name="class" id="102">Class XII
        </label>

    <!--For creating Checkbox-->

        <label for="Math">

        <select name="city">

        <br><br><br>
        <textarea name="feedback" id="205" placeholder="Please Give your valuable feedback" rows="5">Feedback</textarea>
